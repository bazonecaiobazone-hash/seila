name: Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl i686-unknown-linux-musl aarch64-unknown-linux-musl
      - run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: |
          F="-C opt-level=z -C strip=symbols -C panic=abort"
          rustc --target x86_64-unknown-linux-musl $F main.rs -o app-x86_64
          rustc --target i686-unknown-linux-musl $F main.rs -o app-i686
          rustc --target aarch64-unknown-linux-musl $F -C linker=aarch64-linux-gnu-gcc main.rs -o app-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: binarios
          path: app-*
